<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting StudyWise AI</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .card {
        width: 100%;
        height: 100%;
        padding: 28px 32px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border: 1px solid #1e293b;
        background: linear-gradient(155deg, #0f172a 0%, #172554 100%);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: #1d4ed8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 18px;
        color: #ffffff;
        letter-spacing: -0.02em;
      }
      .title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .subtitle {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 2px;
      }
      .status-block {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .status-text {
        font-size: 12.5px;
        color: #cbd5e1;
      }
      .bar-track {
        width: 100%;
        height: 4px;
        background: rgba(148, 163, 184, 0.22);
        border-radius: 999px;
        overflow: hidden;
      }
      .bar-fill {
        width: 45%;
        height: 100%;
        background: #3b82f6;
        border-radius: 999px;
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
      .footer {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="logo">SW</div>
        <div>
          <div class="title">StudyWise AI</div>
          <div class="subtitle">Philippines Grade 7–12 · Local-First Study Companion</div>
        </div>
      </div>

      <div class="status-block">
        <div class="status-text">Initializing SQLite student database &amp; offline document vault...</div>
        <div class="bar-track">
          <div class="bar-fill"></div>
        </div>
      </div>

      <div class="footer">
        <span>Offline-Ready Desktop Workspace</span>
        <span>v1.0.0</span>
      </div>
    </div>
  </body>
</html>
