[package]
name = "studywise-ai"
version = "1.0.0"
description = "StudyWise AI — Offline-first Grade 7-12 Philippine Educational Companion"
authors = ["StudyWise AI"]
edition = "2021"

[lib]
name = "studywise_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
